name: Pages

# Publishes site/ to GitHub Pages: the privacy policy Google Play links to, and the live
# location page the SOS alerts link to.
on:
  push:
    branches: [main]
    paths: ["site/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      # The live page reads the trail with the project's public (publishable) key.
      - name: Point the live page at the backend
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "SUPABASE_URL or SUPABASE_ANON_KEY is missing; the live page will say the link doesn't work."
          else
            printf 'window.POCKET_GUARD = { url: "%s", key: "%s" };\n' "${SUPABASE_URL%/}" "$SUPABASE_ANON_KEY" > site/live/config.js
          fi
      # A private address for privacy requests, when the repository variable CONTACT_EMAIL is set.
      - name: Fill in the contact address
        env:
          CONTACT_EMAIL: ${{ vars.CONTACT_EMAIL }}
        run: |
          [ -n "$CONTACT_EMAIL" ] || { echo "CONTACT_EMAIL not set: the policy points to GitHub issues."; exit 0; }
          python3 - <<'EOF'
          import html, os, re
          e = html.escape(os.environ["CONTACT_EMAIL"].strip())
          p = "site/privacy.html"
          s = open(p).read()
          s = re.sub(r"<!--contact-->.*?<!--/contact-->",
                     f'<p>Questions or requests, including deletion: email <a href="mailto:{e}">{e}</a>.</p>', s, flags=re.S)
          open(p, "w").write(s)
          EOF
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
