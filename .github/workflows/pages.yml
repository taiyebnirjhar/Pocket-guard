name: Pages

# Publishes site/ to Cloudflare Pages (https://pocket-guard.pages.dev): the privacy policy Google
# Play links to, and the live location page the SOS alerts link to. Cloudflare rather than GitHub
# Pages because the repository is private. Needs the CLOUDFLARE_API_TOKEN secret (Cloudflare
# Pages: Edit) and CLOUDFLARE_ACCOUNT_ID.
on:
  push:
    branches: [main]
    paths: ["site/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      # The live page reads the trail with the project's public (publishable) key.
      - name: Point the live page at the backend
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "SUPABASE_URL or SUPABASE_ANON_KEY is missing; the live page will say the link doesn't work."
          else
            printf 'window.POCKET_GUARD = { url: "%s", key: "%s" };\n' "${SUPABASE_URL%/}" "$SUPABASE_ANON_KEY" > site/live/config.js
          fi
      # A private address for privacy requests, when the repository variable CONTACT_EMAIL is set.
      - name: Fill in the contact address
        env:
          CONTACT_EMAIL: ${{ vars.CONTACT_EMAIL }}
        run: |
          [ -n "$CONTACT_EMAIL" ] || { echo "CONTACT_EMAIL not set: the policy points to GitHub issues."; exit 0; }
          python3 - <<'EOF'
          import html, os, re
          e = html.escape(os.environ["CONTACT_EMAIL"].strip())
          p = "site/privacy.html"
          s = open(p).read()
          s = re.sub(r"<!--contact-->.*?<!--/contact-->",
                     f'<p>Questions or requests, including deletion: email <a href="mailto:{e}">{e}</a>.</p>', s, flags=re.S)
          open(p, "w").write(s)
          EOF
      - name: Publish to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::Add the CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID secrets first."
            exit 1
          fi
          # The first run creates the project; later runs find it there already.
          npx -y wrangler@4.20.0 pages project list | grep -q ' pocket-guard ' ||
            npx -y wrangler@4.20.0 pages project create pocket-guard --production-branch main
          # Always the production site, whichever branch a manual run starts from.
          npx -y wrangler@4.20.0 pages deploy site --project-name pocket-guard --branch main --commit-dirty=true
          npx -y wrangler@4.20.0 pages project list
