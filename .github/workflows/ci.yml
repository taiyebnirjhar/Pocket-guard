name: CI

on:
  push:
    branches: [main]
    paths-ignore: ["**/*.md"]
  pull_request:
    paths-ignore: ["**/*.md"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      signed: ${{ steps.key.outputs.signed }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        run: ./gradlew testFullDebugUnitTest --stacktrace

      - name: Lint
        run: |
          # Both builds: the Play one declares fewer permissions, so lint sees different code paths.
          ./gradlew lintFullDebug lintPlayRelease || {
            find app/build/intermediates -name 'lint-results-*.txt' -exec cat {} +
            exit 1
          }

      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-report-${{ github.run_number }}
          path: app/build/reports/lint-results-*
          if-no-files-found: ignore

      # Official builds only: forks and pull requests have no access to the key and use the
      # standard debug key instead.
      - name: Read version
        id: version
        run: echo "version=$(tr -d '[:space:]' < VERSION)" >> "$GITHUB_OUTPUT"

      - name: Load signing key
        id: key
        env:
          KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "SIGNING_KEYSTORE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "signed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Build APK
        env:
          SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
          # The online part's project and public key; absent on forks, which then build offline.
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: ./gradlew assembleFullDebug bundlePlayRelease --stacktrace

      - name: Rename APK and bundle
        run: |
          mkdir -p dist play
          cp app/build/outputs/apk/full/debug/app-full-debug.apk dist/PocketGuard-${{ github.run_number }}.apk
          cp app/build/outputs/bundle/playRelease/app-play-release.aab play/PocketGuard-${{ github.run_number }}-play.aab

      - uses: actions/upload-artifact@v4
        with:
          name: PocketGuard-${{ github.run_number }}
          path: dist/*.apk

      # For uploading to Google Play by hand; signed with the upload key on official builds.
      - uses: actions/upload-artifact@v4
        with:
          name: PocketGuard-play-${{ github.run_number }}
          path: play/*.aab

  # The database rules and the functions, against a local Supabase with a stand-in for Brevo.
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: 2.121.0

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Format and lint
        working-directory: supabase
        run: deno fmt --check functions tests && deno lint functions tests

      # A stand-in for R2 (s3rver; it doesn't check signatures, tests/signing_test.ts does).
      - name: Start a local backend
        env:
          BREVO_API_KEY: test
          BREVO_API_URL: http://host.docker.internal:9999/v3
          BREVO_SENDER_EMAIL: alerts@example.com
          LIVE_PAGE_URL: https://taiyebnirjhar.github.io/Pocket-guard/live/
          R2_ENDPOINT: http://host.docker.internal:9000
          R2_PUBLIC_ENDPOINT: http://127.0.0.1:9000
          R2_ACCESS_KEY_ID: S3RVER
          R2_SECRET_ACCESS_KEY: S3RVER
          R2_BUCKET: pocket-guard-media
        run: |
          mkdir -p "$RUNNER_TEMP/s3"
          nohup npx -y s3rver@3.7.1 -d "$RUNNER_TEMP/s3" -a 0.0.0.0 -p 9000 --no-vhost-buckets \
            --configure-bucket pocket-guard-media >"$RUNNER_TEMP/s3rver.log" 2>&1 &
          supabase start -x vector,logflare,supavisor,postgres-meta,mailpit,imgproxy,storage-api,realtime,studio
          supabase status -o env | grep -E '^(API_URL|PUBLISHABLE_KEY)=' | sed 's/"//g' >> "$GITHUB_ENV"

      - name: Backend tests
        working-directory: supabase
        run: deno test --allow-net --allow-env tests/

      - name: The daily database jobs run
        run: |
          psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" -v ON_ERROR_STOP=1 \
            -c 'do $$ declare j record; begin for j in select command from cron.job loop execute j.command; end loop; end $$;'

      - name: Deployment check, run locally
        working-directory: supabase
        run: deno run --allow-net --allow-env tests/smoke.ts

  e2e:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      # Private repositories get smaller runners (2 cores, little free disk): the emulator's data
      # partition alone needs over 7 GB. Remove toolchains this job never uses first.
      - name: Free disk space
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /usr/local/share/boost \
            /usr/local/lib/android/sdk/ndk /opt/hostedtoolcache/CodeQL /usr/local/share/powershell \
            /usr/local/julia* /usr/share/swift
          docker image prune -af >/dev/null 2>&1 || true
          df -h /

      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: PocketGuard-${{ github.run_number }}
          path: dist

      # The app's online part talks to this local backend during the test, never the real one.
      - uses: supabase/setup-cli@v1
        with:
          version: 2.121.0

      - name: Start a local backend
        run: bash e2e/backend.sh

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Emulator end-to-end test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          disable-animations: true
          # A smaller data partition (the test needs well under 1 GB) and more time to boot on 2 cores.
          disk-size: 3G
          emulator-boot-timeout: 900
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-front emulated -camera-back emulated
          script: bash e2e/run.sh dist/PocketGuard-${{ github.run_number }}.apk

      - name: Upload e2e diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-output-${{ github.run_number }}
          path: e2e-output
          if-no-files-found: ignore

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screens-${{ github.run_number }}
          path: e2e-output/screens
          if-no-files-found: ignore

  release:
    needs: [build, backend, e2e]
    # Only signed builds from main become releases.
    if: needs.build.outputs.signed == 'true' && github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.build.outputs.version }}
    steps:
      # A release per version: pushes that keep the same VERSION are tested but not released.
      - name: Check whether this version is already released
        id: tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh api "repos/${{ github.repository }}/git/ref/tags/v$VERSION" >/dev/null 2>&1; then
            echo "v$VERSION is already released; bump VERSION to publish a new one."
            echo "exists=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/download-artifact@v4
        if: steps.tag.outputs.exists != 'true'
        with:
          name: PocketGuard-${{ github.run_number }}
          path: dist

      - uses: actions/download-artifact@v4
        if: steps.tag.outputs.exists != 'true'
        with:
          name: screens-${{ github.run_number }}
          path: screens

      - uses: actions/download-artifact@v4
        if: steps.tag.outputs.exists != 'true'
        with:
          name: PocketGuard-play-${{ github.run_number }}
          path: play

      - name: Name the APK and bundle after the version
        if: steps.tag.outputs.exists != 'true'
        run: |
          mv dist/*.apk "dist/PocketGuard-v$VERSION.apk"
          mv play/*.aab "dist/PocketGuard-v$VERSION-play.aab"

      - name: Publish release
        if: steps.tag.outputs.exists != 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}
          name: Pocket Guard v${{ env.VERSION }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          generate_release_notes: true
          files: |
            dist/*.apk
            dist/*.aab
            screens/*.png
          body: |
            Download `PocketGuard-v${{ env.VERSION }}.apk` below on your Android phone and install it.
            `PocketGuard-v${{ env.VERSION }}-play.aab` is the Google Play build, for uploading in Play Console.
            Passed unit tests, lint and the emulator end-to-end test; the PNGs are screenshots of
            every screen taken during that test.
