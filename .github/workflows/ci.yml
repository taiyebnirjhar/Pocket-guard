name: CI

on:
  push:
    branches: [main]
    paths-ignore: ["**/*.md"]
  pull_request:
    paths-ignore: ["**/*.md"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      signed: ${{ steps.key.outputs.signed }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Lint
        run: |
          ./gradlew lintDebug || {
            cat app/build/intermediates/lint_intermediate_text_report/debug/lintReportDebug/lint-results-debug.txt
            exit 1
          }

      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-report-${{ github.run_number }}
          path: app/build/reports/lint-results-debug.*
          if-no-files-found: ignore

      # Official builds only: forks and pull requests have no access to the key and use the
      # standard debug key instead.
      - name: Load signing key
        id: key
        env:
          KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "SIGNING_KEYSTORE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "signed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Build APK
        env:
          SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
        run: ./gradlew assembleDebug --stacktrace

      - name: Rename APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/PocketGuard-${{ github.run_number }}.apk

      - uses: actions/upload-artifact@v4
        with:
          name: PocketGuard-${{ github.run_number }}
          path: dist/*.apk

  e2e:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: PocketGuard-${{ github.run_number }}
          path: dist

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Emulator end-to-end test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-front emulated -camera-back emulated
          script: bash e2e/run.sh dist/PocketGuard-${{ github.run_number }}.apk

      - name: Upload e2e diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-output-${{ github.run_number }}
          path: e2e-output
          if-no-files-found: ignore

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screens-${{ github.run_number }}
          path: e2e-output/screens
          if-no-files-found: ignore

  release:
    needs: [build, e2e]
    # Only signed builds from main become releases.
    if: needs.build.outputs.signed == 'true' && github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: PocketGuard-${{ github.run_number }}
          path: dist

      - uses: actions/download-artifact@v4
        with:
          name: screens-${{ github.run_number }}
          path: screens

      - name: Publish release for phone download
        uses: softprops/action-gh-release@v2
        with:
          tag_name: pocket-guard-build-${{ github.run_number }}
          name: Pocket Guard build ${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          prerelease: true
          files: |
            dist/*.apk
            screens/*.png
          body: |
            Test build from `${{ github.ref_name }}` (${{ github.sha }}).
            Passed unit tests, lint and the emulator end-to-end test.
            Download the APK below on your phone and install it.
            The PNGs are screenshots of each screen, taken on the emulator during the test.
